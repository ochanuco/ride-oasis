name = "ride-oasis"
main = "worker.mjs"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Custom domain と併用しても workers.dev / version preview URL を残す。
# false にすると `<version-id>-ride-oasis.teacatus.workers.dev` も同時に
# 無効化され Workers Builds の per-branch preview が機能しなくなるため、
# 意図的に true で固定する。
workers_dev = true
preview_urls = true

# Custom domain. The DNS record + worker route are managed in the Cloudflare
# Dashboard (Workers & Pages → ride-oasis → Settings → Domains & Routes); this
# entry mirrors that binding so `wrangler deploy` does not warn about an
# unknown route, and so reviewers can see where the Worker is actually served.
[[routes]]
pattern = "oasis.ochanu.co"
custom_domain = true

# Static frontend served straight from frontend/. The Worker only intercepts
# the supply-point API; everything else falls through to the asset bundle.
[assets]
directory = "frontend"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Rust WASM router (rust-router/pkg/rust_router_bg.wasm).
# Workers Builds (Cloudflare's CI) requires `[[rules]]` to bundle .wasm files
# imported by JS as CompiledWasm modules. ローカル wrangler dev/deploy では
# 暗黙に動くが、Workers Builds の bundler は明示が必要。
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

# Production D1 binding. Run `wrangler d1 create rideoasis-supply-points` once
# and paste the returned database_id below before the first deploy. Local
# `wrangler dev --local` uses an in-memory copy.
[[d1_databases]]
binding = "DB"
database_name = "rideoasis-supply-points"
database_id = "d93cd527-2a12-4096-a519-cc0820008c88"
migrations_dir = "cloudflare/migrations"

# Cycling graph tiles for /api/route. The graph is split into ~5km cells
# (lib/cycling/tile_partition.js, TILE_DEG=0.05) and stored as one NDJSON
# per tile under the tiles/ prefix. Worker fetches just the tiles it needs.
#
# Full pipeline (run locally on a machine with ~8GB RAM):
#   1. Download regional PBF, e.g. Kansai:
#        curl -O https://download.geofabrik.de/asia/japan/kansai-latest.osm.pbf
#   2. Extract cycling graph:
#        node scripts/cycling_build_graph.js \
#          --pbf kansai-latest.osm.pbf --out data/cycling
#   3. Split into tiles:
#        node scripts/cycling_tile_split.js --dir data/cycling
#   4. Upload tiles + index to R2:
#        for f in data/cycling/tiles/*.ndjson; do
#          k=$(basename "$f" .ndjson)
#          wrangler r2 object put "ride-oasis-cycling-graph/tiles/$k.ndjson" --file="$f"
#        done
#        wrangler r2 object put ride-oasis-cycling-graph/tile_index.json \
#          --file=data/cycling/tile_index.json
#
# Until tiles are uploaded /api/route returns 503 with a clear message and
# the frontend falls back to a straight line.
[[r2_buckets]]
binding = "GRAPH"
bucket_name = "ride-oasis-cycling-graph"

[observability]
enabled = true

# Bidirectional Dijkstra on the cycling tile graph can consume more than the
# default 50ms CPU on dense urban tiles (Osaka/Kyoto). Workers Paid allows
# up to 30s when opted-in via [limits].
[limits]
cpu_ms = 30000

# 非本番ブランチからのプレビューには `wrangler versions upload` を使う
# (npm run cf:preview)。同じ ride-oasis Worker に新しい version が
# 追加され、本番トラフィックは影響を受けないまま、その version 専用の
# preview URL (<version-id>-ride-oasis.workers.dev) が返ってくる。
# `wrangler versions deploy` を呼ぶまで本番への昇格は起きない。
