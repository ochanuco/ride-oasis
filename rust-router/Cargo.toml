[package]
name = "rust-router"
version = "0.1.0"
edition = "2021"
description = "Cycling A* router compiled to wasm32, parity PoC vs lib/cycling/tiled_router.js"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
